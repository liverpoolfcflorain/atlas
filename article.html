<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atlas Analytica article">
  <title>Atlas Analytica — Article</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black:#101113;
      --ink:#1d1f22;
      --graphite:#3f4145;
      --charcoal:#505256;
      --slate:#6d7075;
      --mist:#d8d9db;
      --paper:#f2f2f0;
      --white:#fff;
      --line:rgba(16,17,19,.16);
      --display:"Libre Baskerville", Georgia, serif;
      --sans:"DM Sans", Arial, sans-serif;
      --max:1240px;
      --ease:cubic-bezier(.2,.7,.2,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper)}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit}

    .article-nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      min-height:66px;padding:0 28px;
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      color:var(--white);
      background:rgba(16,17,19,.9);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.14);
    }

    .nav-brand{
      display:flex;align-items:center;gap:10px;
      font-family:var(--display);font-size:.92rem;
    }

    .nav-brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
    .back-link{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .back-link:hover{text-decoration:underline}

    #articlePages{padding-top:66px}

    .article-page{
      min-height:calc(100vh - 66px);
      position:relative;
      display:flex;
      align-items:center;
      overflow:hidden;
      padding:90px 24px;
      background-color:var(--graphite);
      background-position:center;
      background-size:cover;
      background-attachment:fixed;
    }

    .article-page::before{
      content:"";
      position:absolute;inset:0;
      background:
        linear-gradient(90deg,rgba(16,17,19,.91) 0%,rgba(16,17,19,.72) 47%,rgba(16,17,19,.35) 100%),
        linear-gradient(0deg,rgba(16,17,19,.35),rgba(16,17,19,.05));
    }

    .page-inner{
      position:relative;z-index:1;
      width:min(100%,var(--max));
      margin:auto;
    }

    .article-content{
      max-width:780px;
      color:var(--white);
    }

    .article-label{
      display:inline-flex;align-items:center;gap:9px;
      margin-bottom:18px;
      color:var(--mist);
      font-size:.67rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    }

    .article-label::before{
      content:"";width:23px;height:1px;background:var(--mist);
    }

    .article-content h1{
      margin:0 0 19px;
      font-family:var(--display);
      font-size:clamp(2.25rem,6vw,5rem);
      line-height:1.06;
      letter-spacing:-.045em;
    }

    .article-content h2{
      margin:0 0 20px;
      font-family:var(--display);
      font-size:clamp(1.8rem,4vw,3.3rem);
      line-height:1.13;
    }

    .article-subheading{
      max-width:650px;
      margin:0 0 28px;
      color:rgba(255,255,255,.76);
      font-size:clamp(1rem,2vw,1.2rem);
      line-height:1.65;
    }

    .article-body{
      max-width:700px;
      color:rgba(255,255,255,.88);
      font-size:1rem;
      line-height:1.9;
    }

    .article-body p{margin:0 0 20px}

    .article-meta{
      display:flex;flex-wrap:wrap;gap:12px 18px;
      margin-top:28px;
      color:rgba(255,255,255,.55);
      font-size:.67rem;font-weight:600;
      letter-spacing:.08em;text-transform:uppercase;
    }

    .article-meta span+span::before{content:"•";margin-right:18px;color:rgba(255,255,255,.3)}

    .page-number{
      position:absolute;right:30px;bottom:28px;z-index:1;
      color:rgba(255,255,255,.5);
      font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    }

    .article-controls{
      position:fixed;right:24px;bottom:24px;z-index:110;
      display:flex;gap:8px;
    }

    .article-controls button{
      width:43px;height:43px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(16,17,19,.8);
      color:var(--white);
      cursor:pointer;
      backdrop-filter:blur(8px);
      transition:background .2s,transform .2s;
    }

    .article-controls button:hover:not(:disabled){
      background:var(--charcoal);transform:translateY(-2px);
    }

    .article-controls button:disabled{opacity:.3;cursor:not-allowed}

    .article-progress{
      position:fixed;left:0;right:0;bottom:0;height:3px;z-index:120;background:rgba(255,255,255,.15)
    }

    .article-progress-bar{height:100%;width:0;background:var(--white);transition:width .2s}

    .loading,.error{
      min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center
    }

    .error h1{font-family:var(--display)}
    .error p{color:var(--slate)}

    @media(max-width:700px){
      .article-nav{padding:0 16px}
      .article-page{padding:72px 20px 95px;background-attachment:scroll}
      .article-page::before{
        background:linear-gradient(90deg,rgba(16,17,19,.9),rgba(16,17,19,.55))
      }
      .article-controls{right:16px;bottom:16px}
      .page-number{right:20px;bottom:20px}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .article-page{background-attachment:scroll}
    }
  </style>
</head>

<body>
  <header class="article-nav">
    <a href="index.html" class="nav-brand">
      <img src="logo.jpg" alt="Atlas Analytica logo" onerror="this.onerror=null;this.src='assets/logo.png'">
      <span>Atlas Analytica</span>
    </a>
    <a href="index.html#latest" class="back-link">← Back to articles</a>
  </header>

  <main id="articlePages">
    <div class="loading">Loading article…</div>
  </main>

  <div class="article-controls" aria-label="Article page controls">
    <button id="prevPage" type="button" aria-label="Previous page">←</button>
    <button id="nextPage" type="button" aria-label="Next page">→</button>
  </div>

  <div class="article-progress" aria-hidden="true">
    <div class="article-progress-bar" id="progressBar"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get("id");

    const pagesEl = document.getElementById("articlePages");
    const prevBtn = document.getElementById("prevPage");
    const nextBtn = document.getElementById("nextPage");
    const progressBar = document.getElementById("progressBar");

    let pages = [];
    let currentPage = 0;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderArticle(article) {
      document.title = `Atlas Analytica — ${article.title}`;
      pages = article.pages || [];

      if (!pages.length) {
        showError("This article has no pages yet.");
        return;
      }

      pagesEl.innerHTML = pages.map((page, index) => {
        const isFirst = index === 0;
        const heading = page.heading || (isFirst ? article.title : "");
        const paragraphs = (page.content || [])
          .map(text => `<p>${escapeHtml(text)}</p>`)
          .join("");

        return `
          <section class="article-page" id="page-${index + 1}"
                   style="background-image:url('${escapeHtml(page.background || article.coverImage || "")}')">
            <div class="page-inner">
              <div class="article-content">
                <div class="article-label">${escapeHtml(article.tag || "Analysis")}</div>
                ${isFirst
                  ? `<h1>${escapeHtml(heading)}</h1>`
                  : `<h2>${escapeHtml(heading)}</h2>`}
                ${page.subheading
                  ? `<p class="article-subheading">${escapeHtml(page.subheading)}</p>`
                  : ""}
                <div class="article-body">${paragraphs}</div>
                <div class="article-meta">
                  <span>${escapeHtml(article.author || "Atlas Analytica")}</span>
                  <span>${escapeHtml(article.date || "")}</span>
                  <span>${escapeHtml(article.readTime || "")}</span>
                </div>
              </div>
            </div>
            <div class="page-number">Page ${index + 1} / ${pages.length}</div>
          </section>
        `;
      }).join("");

      observePages();
      updateControls();
      updateProgress();
    }

    function showError(message) {
      pagesEl.innerHTML = `
        <div class="error">
          <div>
            <h1>Article unavailable</h1>
            <p>${escapeHtml(message)}</p>
            <a href="index.html#latest">← Return to articles</a>
          </div>
        </div>
      `;
      prevBtn.disabled = true;
      nextBtn.disabled = true;
    }

    function getCurrentPage() {
      const pageEls = [...document.querySelectorAll(".article-page")];
      if (!pageEls.length) return 0;

      const target = window.scrollY + window.innerHeight * .45;
      let closest = 0;
      let distance = Infinity;

      pageEls.forEach((page, index) => {
        const distanceToPage = Math.abs(page.offsetTop - target);
        if (distanceToPage < distance) {
          distance = distanceToPage;
          closest = index;
        }
      });

      return closest;
    }

    function updateControls() {
      currentPage = getCurrentPage();
      prevBtn.disabled = currentPage <= 0;
      nextBtn.disabled = currentPage >= pages.length - 1;
      progressBar.style.width =
        pages.length <= 1 ? "100%" : `${(currentPage / (pages.length - 1)) * 100}%`;
    }

    function updateProgress() {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const percentage = total <= 0 ? 100 : (window.scrollY / total) * 100;
      progressBar.style.width = `${Math.min(100, Math.max(0, percentage))}%`;
    }

    function goToPage(index) {
      if (!pages.length) return;
      const safeIndex = Math.max(0, Math.min(index, pages.length - 1));
      document.getElementById(`page-${safeIndex + 1}`)
        ?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function observePages() {
      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];

        if (!visible) return;

        const index = Number(visible.target.id.replace("page-", "")) - 1;
        if (Number.isInteger(index)) {
          currentPage = index;
          prevBtn.disabled = currentPage <= 0;
          nextBtn.disabled = currentPage >= pages.length - 1;
        }
      }, { threshold: [0.35, 0.6, 0.85] });

      document.querySelectorAll(".article-page").forEach(page => observer.observe(page));
    }

    prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
    nextBtn.addEventListener("click", () => goToPage(currentPage + 1));

    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateControls);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        event.preventDefault();
        goToPage(currentPage - 1);
      }
      if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        event.preventDefault();
        goToPage(currentPage + 1);
      }
    });

    async function loadArticle() {
      if (!articleId) {
        showError("No article ID was provided.");
        return;
      }

      try {
        const response = await fetch("articles.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const article = (data.articles || []).find(item => item.id === articleId);

        if (!article) {
          showError(`No article was found for ID "${articleId}".`);
          return;
        }

        renderArticle(article);
      } catch (error) {
        console.error(error);
        showError("The article data could not be loaded. Make sure article.html and articles.json are being served from the same website.");
      }
    }

    loadArticle();
  </script>
</body>
</html>
