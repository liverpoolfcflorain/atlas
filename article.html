<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Analytica — Article</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--black:#101113;--ink:#1d1f22;--slate:#6d7075;--paper:#f2f2f0;--white:#fff;--line:rgba(16,17,19,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:40px 24px 80px}
.back{display:inline-block;color:var(--ink);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:35px}.tag{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--slate)}
h1{font:700 clamp(40px,7vw,72px)/1.02 Georgia,serif;margin:12px 0 18px}.meta{color:var(--slate);font-size:13px;margin-bottom:30px}.hero{width:100%;max-height:560px;object-fit:cover;margin:0 0 38px;border:1px solid var(--line)}.content{white-space:pre-wrap;font-family:Georgia,serif;font-size:18px;line-height:1.9}.excerpt{font-size:20px;line-height:1.6;border-left:3px solid var(--ink);padding-left:18px;margin-bottom:32px}.error{padding:30px;background:#fff;border:1px solid var(--line)}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← Back to Atlas Analytica</a>
<div id="article"></div>
</main>
<script>
const {createClient}=window.supabase;
const atlasSupabase=createClient(window.ATLAS_SUPABASE_URL,window.ATLAS_SUPABASE_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"";
async function load(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id){document.getElementById("article").innerHTML='<div class="error">Article not found.</div>';return}
 const {data,error}=await atlasSupabase.from("articles").select("*").eq("id",id).eq("status","published").maybeSingle();
 if(error||!data){document.getElementById("article").innerHTML='<div class="error">This article is unavailable or has not been published.</div>';return}
 document.title=`${data.title} — Atlas Analytica`;
 document.getElementById("article").innerHTML=`
   <div class="tag">${esc(data.tag)}</div>
   <h1>${esc(data.title)}</h1>
   <div class="meta">${esc(fmt(data.date))} · ${esc(data.read_time||"5 min read")}</div>
   ${data.image?`<img class="hero" src="${esc(data.image)}" alt="${esc(data.title)}">`:""}
   <div class="excerpt">${esc(data.excerpt)}</div>
   <div class="content">${esc(data.content)}</div>`;
}
load();
</script>
</body>
</html>
